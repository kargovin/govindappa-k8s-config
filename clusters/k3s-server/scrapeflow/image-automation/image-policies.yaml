apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: scrapeflow-api-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: scrapeflow-api-repo
  filterTags:
    pattern: '^main-(?P<ts>[0-9]+)-(?P<sha>[a-f0-9]+)'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
