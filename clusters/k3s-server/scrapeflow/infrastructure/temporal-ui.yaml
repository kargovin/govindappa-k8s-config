# Temporal Web UI (ScrapeFlow ADR-009 §2b, implementation backlog A.4).
#
# ⚠️ ClusterIP ONLY — no Ingress, no DNS record, no cert. The UI is a write-capable control plane
# (cancel/terminate/signal/reset any workflow) with no auth of its own, and every tenant's runs
# share the one `scrapeflow` Temporal namespace. Access is a port-forward:
#   kubectl -n scrapeflow port-forward svc/scrapeflow-temporal-ui 8080   → http://localhost:8080
#
# Its own version line (temporalio/ui 2.x), not the server's — pinned by hand, not under Flux
# image automation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapeflow-temporal-ui
  namespace: scrapeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapeflow-temporal-ui
  template:
    metadata:
      labels:
        app: scrapeflow-temporal-ui
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.54.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: scrapeflow-temporal:7233
            - name: TEMPORAL_DEFAULT_NAMESPACE
              value: scrapeflow
            # The browser's origin through the port-forward above.
            - name: TEMPORAL_CORS_ORIGINS
              value: http://localhost:8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scrapeflow-temporal-ui
  namespace: scrapeflow
spec:
  type: ClusterIP
  selector:
    app: scrapeflow-temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
