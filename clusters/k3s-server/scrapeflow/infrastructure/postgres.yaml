apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrapeflow-postgresql
  namespace: scrapeflow
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: ">=16.0.0 <17.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    global:
      imageRegistry: oci.bitnami.com
    auth:
      existingSecret: scrapeflow-db-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: postgres-password
        replicationPasswordKey: postgres-password
      username: scrapeflow
      database: scrapeflow
    primary:
      persistence:
        size: 10Gi
