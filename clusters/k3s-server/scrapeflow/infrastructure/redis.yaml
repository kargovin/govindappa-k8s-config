apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrapeflow-redis-master
  namespace: scrapeflow
spec:
  serviceName: scrapeflow-redis-master
  replicas: 1
  selector:
    matchLabels:
      app: scrapeflow-redis
  template:
    metadata:
      labels:
        app: scrapeflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "60", "1", "--dir", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scrapeflow-redis-master
  namespace: scrapeflow
spec:
  type: ClusterIP
  selector:
    app: scrapeflow-redis
  ports:
    - port: 6379
      targetPort: 6379
