apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrapeflow-redis
  namespace: scrapeflow
spec:
  interval: 1h
  chart:
    spec:
      chart: redis
      version: ">=7.0.0 <8.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    architecture: standalone
    auth:
      enabled: false
    master:
      persistence:
        size: 2Gi
