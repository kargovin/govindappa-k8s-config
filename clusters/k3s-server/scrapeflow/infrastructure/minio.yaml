apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrapeflow-minio
  namespace: scrapeflow
spec:
  interval: 1h
  chart:
    spec:
      chart: minio
      sourceRef:
        kind: HelmRepository
        name: minio-official
        namespace: flux-system
  values:
    existingSecret: scrapeflow-minio-credentials
    defaultBuckets: "scrapeflow-results"
    persistence:
      size: 20Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    mode: standalone
