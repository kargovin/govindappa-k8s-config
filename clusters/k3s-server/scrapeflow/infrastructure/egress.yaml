# Egress proxy (ScrapeFlow BUG-010 part 2): Stripe Smokescreen. The http, playwright and LLM workers send
# every fetch of a user-chosen address through it (EGRESS_PROXY_URL): it resolves each name once, refuses
# any address that is not public unicast (a 407 with X-Smokescreen-Error) and connects to the address it
# checked — redirects included, since each hop is a new request. Its own NetworkPolicy is the second
# layer (app/egress-networkpolicy.yaml).
#
# The ConfigMap is a copy of the app repo's docker/egress/smokescreen.yaml (canonical; keep them equal).
# --deny-address appends to its deny list: the node's own public IP, which is public but reaches the
# host from inside (BUG-032). Pinned by digest, by hand — not under Flux image automation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrapeflow-egress
  namespace: scrapeflow
data:
  smokescreen.yaml: |
    # The egress proxy's config (BUG-010 part 2): every worker fetch of a user-chosen address goes
    # through it. Canonical copy — the infra repo's ConfigMap mirrors this file.
    #
    # Smokescreen already refuses loopback, link-local, multicast, unspecified, broadcast, private
    # (RFC 1918, fc00::/7), 100.64.0.0/10, every IPv4-embedding IPv6 prefix (NAT64, 6to4, Teredo) and
    # its own addresses. The ranges below close the rest of ScrapeFlow's rule, public unicast only
    # (core/security.is_public_address): the special-purpose blocks Python's is_global refuses.
    # ⚠️ Command-line --deny-range/--deny-address flags append to this list (production adds the
    # node's public IP that way); they never replace it.

    allow_missing_role: true # no mTLS client identity: every caller gets the default (open) ACL
    connect_timeout: 10s
    dns_timeout: 5s

    deny_ranges:
      - 0.0.0.0/8 # "this network"
      - 192.0.0.0/24 # IETF protocol assignments
      - 192.0.2.0/24 # TEST-NET-1
      - 198.18.0.0/15 # benchmarking
      - 198.51.100.0/24 # TEST-NET-2
      - 203.0.113.0/24 # TEST-NET-3
      - 240.0.0.0/4 # reserved
      - 100::/64 # discard-only
      - 2001::/23 # IETF protocol assignments (Teredo included)
      - 2001:db8::/32 # documentation
      - 3fff::/20 # documentation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapeflow-egress
  namespace: scrapeflow
spec:
  # Two: every scrape and every base_url LLM call goes through it.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: scrapeflow-egress
  template:
    metadata:
      labels:
        app: scrapeflow-egress
      annotations:
        # Roll the pods when the config changes (bump by hand with the ConfigMap).
        scrapeflow/egress-config: "1"
    spec:
      containers:
        - name: smokescreen
          image: ghcr.io/stripe/smokescreen:v1.0.1@sha256:e62052a184ce5ef97c32b00a32583fc5376d4ca5d9ec941cf9a4566eef0556e8
          args:
            - --config-file
            - /etc/smokescreen/smokescreen.yaml
            - --listen-port
            - "4750"
            - --deny-address
            - 139.99.121.44
          ports:
            - name: proxy
              containerPort: 4750
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/smokescreen
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: scrapeflow-egress
---
apiVersion: v1
kind: Service
metadata:
  name: scrapeflow-egress
  namespace: scrapeflow
spec:
  selector:
    app: scrapeflow-egress
  ports:
    - name: proxy
      port: 4750
      targetPort: proxy
