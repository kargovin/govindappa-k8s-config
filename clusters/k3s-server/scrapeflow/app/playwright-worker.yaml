apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapeflow-playwright-worker
  namespace: scrapeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapeflow-playwright-worker
  template:
    metadata:
      labels:
        app: scrapeflow-playwright-worker
    spec:
      initContainers:
        - name: wait-for-nats
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-nats 4222; do echo waiting for nats; sleep 2; done']
        - name: wait-for-minio
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-minio 9000; do echo waiting for minio; sleep 2; done']
      containers:
        - name: playwright-worker
          image: k4rth/scrapeflow-playwright-worker:main-1783079436-4257183b852a389a75abfba20805357c20ed4635 # {"$imagepolicy": "flux-system:scrapeflow-playwright-worker-policy"}
          # Anti-bot hardening (ScrapeFlow ADR-008): the worker now runs REAL,
          # HEADED Google Chrome under Xvfb (not headless Chromium), which uses
          # materially more CPU/RAM — multiplied by PLAYWRIGHT_MAX_WORKERS (3
          # concurrent Chrome contexts) + the Xvfb server. Bumped accordingly.
          # (/dev/shm pressure is handled in-app via --disable-dev-shm-usage.)
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          env:
            - name: NATS_URL
              value: "nats://scrapeflow-nats:4222"
            - name: MINIO_ENDPOINT
              value: "scrapeflow-minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootPassword
            - name: MINIO_BUCKET
              value: "scrapeflow-results"
            - name: MINIO_SECURE
              value: "false"
            - name: PLAYWRIGHT_MAX_WORKERS
              value: "3"
            - name: PLAYWRIGHT_DEFAULT_TIMEOUT_SECONDS
              value: "60"
            - name: CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-app-secrets
                  key: credentials-encryption-key
