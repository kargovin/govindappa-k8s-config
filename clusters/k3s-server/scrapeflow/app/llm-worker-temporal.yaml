apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapeflow-llm-worker-temporal
  namespace: scrapeflow
spec:
  replicas: 1
  # Stateless poller of the `llm` task queue: a surge pod polling beside the draining old one is harmless.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: scrapeflow-llm-worker-temporal
  template:
    metadata:
      labels:
        app: scrapeflow-llm-worker-temporal
    spec:
      # The worker drains an in-flight LLM call for up to 400 s on SIGTERM (LLM_GRACEFUL_SHUTDOWN_SECONDS);
      # this must stay above it, or the kill cancels the call and the retry re-bills the user's key.
      terminationGracePeriodSeconds: 420
      initContainers:
        - name: wait-for-temporal
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-temporal 7233; do echo waiting for temporal; sleep 2; done']
        - name: wait-for-minio
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-minio 9000; do echo waiting for minio; sleep 2; done']
      containers:
        - name: llm-worker
          image: k4rth/scrapeflow-llm-worker:main-1793207138-722f54b297ab471ebbc660d7739235c0c8c3e1db # {"$imagepolicy": "flux-system:scrapeflow-llm-worker-policy"}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No DB env: a light worker (Temporal + MinIO only).
          env:
            - name: TEMPORAL_ADDRESS
              value: "scrapeflow-temporal:7233"
            - name: TEMPORAL_NAMESPACE
              value: "scrapeflow"
            - name: MINIO_ENDPOINT
              value: "scrapeflow-minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootPassword
            - name: MINIO_BUCKET
              value: "scrapeflow-results"
            - name: MINIO_SECURE
              value: "false"
            - name: LLM_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-app-secrets
                  key: llm-key-encryption-key
            - name: LLM_MAX_WORKERS
              value: "3"
            # Modal cold start is 90-110 s; with the 180 s warm-up budget the activity needs ~360 s start-to-close.
            - name: LLM_REQUEST_TIMEOUT_SECONDS
              value: "180"
            - name: LLM_MAX_CONTENT_CHARS
              value: "50000"
