apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrapeflow-cleanup
  namespace: scrapeflow
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-postgres
              image: busybox
              command: ['sh', '-c', 'until nc -z scrapeflow-postgresql 5432; do echo waiting for postgres; sleep 2; done']
            - name: wait-for-minio
              image: busybox
              command: ['sh', '-c', 'until nc -z scrapeflow-minio 9000; do echo waiting for minio; sleep 2; done']
          containers:
            - name: cleanup
              image: k4rth/scrapeflow-api:main-1795718190-e4b760be35c08c5e419127c21884af96591dcbb9 # {"$imagepolicy": "flux-system:scrapeflow-api-policy"}
              # The image's venv python, run as a module from /app (BUG-019): bare `python` has none
              # of the app's packages, and a path puts scripts/ (not /app) on sys.path.
              command: ["/app/.venv/bin/python", "-m", "scripts.cleanup_old_runs"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-db-credentials
                      key: database-url
                - name: MINIO_ENDPOINT
                  value: "scrapeflow-minio:9000"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-minio-credentials
                      key: rootUser
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-minio-credentials
                      key: rootPassword
                - name: MINIO_BUCKET
                  value: "scrapeflow-results"
                - name: MINIO_SECURE
                  value: "false"
                - name: SCHEDULE_RUN_RETENTION_DAYS
                  value: "90"
                # Required by app.settings at import, like the API's.
                - name: LLM_KEY_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-app-secrets
                      key: llm-key-encryption-key
                - name: CREDENTIALS_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-app-secrets
                      key: credentials-encryption-key
                - name: DESTINATION_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scrapeflow-destination-secrets
                      key: destination-encryption-key
                - name: PUBLIC_BASE_URL
                  value: "https://scrapeflow.govindappa.com"
