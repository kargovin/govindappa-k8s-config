apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapeflow-coordinator
  namespace: scrapeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapeflow-coordinator
  template:
    metadata:
      labels:
        app: scrapeflow-coordinator
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-postgresql 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-nats
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-nats 4222; do echo waiting for nats; sleep 2; done']
        - name: wait-for-minio
          image: busybox
          command: ['sh', '-c', 'until nc -z scrapeflow-minio 9000; do echo waiting for minio; sleep 2; done']
      containers:
        - name: coordinator
          image: k4rth/scrapeflow-coordinator:main-1778439784-b32f5cc9c8c483e370a166f09645f3502da45a8c # {"$imagepolicy": "flux-system:scrapeflow-coordinator-policy"}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-db-credentials
                  key: database-url
            - name: NATS_URL
              value: "nats://scrapeflow-nats:4222"
            - name: MINIO_ENDPOINT
              value: "scrapeflow-minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scrapeflow-minio-credentials
                  key: rootPassword
            - name: MINIO_BUCKET
              value: "scrapeflow-results"
            - name: MINIO_SECURE
              value: "false"
            - name: COORDINATOR_DISPATCH_BATCH_SIZE
              value: "10"
            - name: COORDINATOR_DISPATCH_POLL_INTERVAL
              value: "2"
            - name: COORDINATOR_STALE_THRESHOLD_MINUTES
              value: "10"
