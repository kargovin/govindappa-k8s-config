apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system # Uses the repo root
  path: ./infrastructure # Points to your root 'infrastructure' folder
  prune: true
  wait: true # Waits for Cert-Manager/CRDs to be ready