apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: default
spec:
  redirectRegex:
    regex: "^https://www\\.govindappa\\.com/(.*)"
    replacement: "https://govindappa.com/${1}"
    permanent: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-web
  template:
    metadata:
      labels:
        app: static-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        # Map the container's web folder...
        - mountPath: /usr/share/nginx/html
          name: local-html
          readOnly: true
      volumes:
      # ...to the actual folder on your dedicated server
      - name: local-html
        hostPath:
          path: /var/www/govindappa.com/html
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: static-web-service
  namespace: default
spec:
  selector:
    app: static-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# Canonical ingress — serves govindappa.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-web-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: govindappa.com
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - govindappa.com
    secretName: govindappa-tls
  rules:
  - host: govindappa.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: static-web-service
            port:
              number: 80

---
# Redirect ingress — 301s www.govindappa.com → govindappa.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-redirect-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: www.govindappa.com
    traefik.ingress.kubernetes.io/router.middlewares: "default-www-redirect@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - www.govindappa.com
    secretName: www-govindappa-tls
  rules:
  - host: www.govindappa.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: static-web-service
            port:
              number: 80
