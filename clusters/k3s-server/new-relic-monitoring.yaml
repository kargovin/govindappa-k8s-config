apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newrelic-bundle
  namespace: newrelic
spec:
  interval: 1h
  chart:
    spec:
      chart: nri-bundle
      version: "6.0.35"
      sourceRef:
        kind: HelmRepository
        name: newrelic
        namespace: flux-system

  values:
    global:
      customSecretName: newrelic-secret
      customSecretLicenseKey: licenseKey
      cluster: "Kimsufi"
      lowDataMode: true    # <--- ENABLED

    # 1. Infrastructure (CPU/RAM)
    newrelic-infrastructure:
      enabled: true
      privileged: true

    # 2. Kubernetes Events (Pod Crashes)
    nri-kube-events:
      enabled: true

    # 3. Logging (Forwarding logs to Cloud)
    newrelic-logging:
      enabled: true
      lowDataMode: true
      privileged: true

    # 4. Kube State Metrics (Cluster Health)
    kube-state-metrics:
      enabled: true
      image:
        tag: "v2.13.0"     # Pinned version from your command

    # 5. Prometheus Agent (Scraping metrics)
    newrelic-prometheus-agent:
      enabled: true
      lowDataMode: true
      config:
        kubernetes:
          integrations_filter:
            enabled: false
          scrape_interval: 300s
          common:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - "kube-system"
                    - "newrelic"
                    - "flux-system"