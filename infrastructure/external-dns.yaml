apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  targetNamespace: kube-system # ExternalDNS runs here in your setup
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "6.20.4" # Best practice to pin a version (approximate based on v0.13.5 app version)
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # 1. Provider Settings
    provider: cloudflare
    cloudflare:
      apiTokenSecret: cloudflare-api-token
    # 2. Scope & Filters
    domainFilters:
      - govindappa.com
    sources:
      - ingress
      - service
    # 3. Ownership & Registry (The "Safety" Settings)
    registry: txt
    txtOwnerId: k3s-govindappa
    policy: sync # Allows deleting records (keeping DNS clean)

    # 4. Standard Logs
    logLevel: info
    logFormat: text