apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # This file name MUST end in .override for K3s to pick it up
  silence.override: |
    errors {
        consolidate 5m
    }
    # Optional: Add stable upstream DNS if your host DNS is flaky
    forward . 8.8.8.8 1.1.1.1